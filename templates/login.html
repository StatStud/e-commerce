{% extends "base.html" %}
{% block title %}Sign in — {{ setting('store_name') }}{% endblock %}
{% block content %}
<section class="container section auth">
  <div class="auth-card">
    <h1 class="chrome-text">Sign in</h1>
    <form method="post">
      <label>Email<input type="email" name="email" required autofocus></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
